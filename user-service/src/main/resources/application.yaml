spring:
  application:
    name: user-service
  datasource:
    url: jdbc:mysql://localhost:3306/user_db?createDatabaseIfNotExist=true
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.support.serializer.JsonSerializer


  server:
    port: 8081

  jwt:
    secret:
    expiration:
    refresh-expiration:


aws:
  access-key:
  secret-key:
  region:
    s3:
      bucket-name:


management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
